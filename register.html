
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | RK TEX</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">RK <span>TEX</span></a>
        <a href="index.html" class="back-link">← Back to Home</a>
    </header>

    <main class="auth-container">
        <section class="auth-card register-card">
            <a href="index.html" class="brand-small">RK <span>TEX</span></a>

            <p class="eyebrow">JOIN THE STYLE</p>
            <h1>Create Account</h1>
            <p class="subtitle">Create your account and discover your style.</p>

            <form action="#" method="get">
                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    autocomplete="tel"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >

                <label for="password">Create Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label class="terms">
                    <input type="checkbox" name="terms" required>
                    I agree to the Terms and Conditions.
                </label>

                <button type="submit" class="auth-button">
                    CREATE ACCOUNT
                </button>
            </form>

            <p class="switch-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <a href="index.html" class="home-link">← Return to RK TEX</a>
        </section>
    </main>

    <footer class="footer">
        © 2026 RK TEX. All Rights Reserved.
    </footer>

</body>
</html>
