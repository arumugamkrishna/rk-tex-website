
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RK TEX</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">RK <span>TEX</span></a>
        <a href="index.html" class="back-link">← Back to Home</a>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <a href="index.html" class="brand-small">RK <span>TEX</span></a>

            <p class="eyebrow">WELCOME BACK</p>
            <h1>Login to Your Account</h1>
            <p class="subtitle">Your style journey continues here.</p>

            <form action="#" method="get">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>
                    <a href="register.html">Create an account?</a>
                </div>

                <button type="submit" class="auth-button">LOGIN</button>
            </form>

            <p class="switch-text">
                Don't have an account?
                <a href="register.html">Sign Up</a>
            </p>

            <a href="index.html" class="home-link">← Return to RK TEX</a>
        </section>
    </main>

    <footer class="footer">
        © 2026 RK TEX. All Rights Reserved.
    </footer>

</body>
</html>
